# docker-compose.yml
# Run the interactive TUI:  docker compose run --rm hackingtool
# Or pull the published image instead of building:
#   docker run -it --rm ghcr.io/0hakxx/hackingtool:latest
# 0hakxx 미러: 상위(Z4nzu)는 공식 이미지를 아직 레지스트리에 올리지 않아
# 원래 image: 참조는 docker compose pull 시 unknown manifest 로 실패했다.
# 이 미러가 ghcr.io/0hakxx/hackingtool 로 공식 빌드를 공개했으니 그걸 쓴다.

services:
  hackingtool:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/0hakxx/hackingtool:latest
    container_name: hackingtool
    stdin_open: true
    tty: true
    # Persist tools installed at runtime across container restarts.
    volumes:
      - hackingtool_data:/root/.hackingtool

volumes:
  hackingtool_data:
